[project]
name = "portfolio-backend"
version = "0.1.0"
description = "FastAPI backend for Johan Rendon's portfolio and its AI assistant"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
