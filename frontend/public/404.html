<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>404 | Johan Rendon</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { --paper: #f1f3ef; --ink: #18201b; --muted: #4e5a52; --accent: #1f5c45; }
      @media (prefers-color-scheme: dark) {
        :root { --paper: #151b18; --ink: #e4eae6; --muted: #a7b3ac; --accent: #84c9a6; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
        background: var(--paper); color: var(--ink); font: 1.0625rem/1.6 system-ui, sans-serif; }
      main { max-width: 34rem; }
      h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 1rem; }
      p { margin: 0 0 0.5rem; color: var(--muted); }
      a { display: inline-block; min-height: 44px; padding: 0.5rem 0; font-weight: 600; color: var(--accent); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p lang="es">Esta página no existe.</p>
      <p lang="en">This page does not exist.</p>
      <p><a lang="es" href="/es/">Ir al inicio</a></p>
      <p><a lang="en" href="/en/">Go to the home page</a></p>
    </main>
  </body>
</html>
